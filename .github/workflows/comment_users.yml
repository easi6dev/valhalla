name: Comment Assignees

on:
  pull_request:
    types: [assigned, review_requested]

jobs:
  comment-in-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const event = ${{ toJson(github.event.action) }}
            console.log(event)
            
            const author = ${{ toJson(github.event.pull_request.user.login) }}
            const user = ${{ toJson(github.event.sender.login) }}
            let target
            
            if (event == 'review_requested') {
              target = ${{ toJson(github.event.requested_reviewer.login) }}
            } else if (event == 'assigned') {
              target = ${{ toJson(github.event.assignee.login) }}
            } else {
              return
            }
            
            let user_mentions
            
            if (user != target) {
              user_mentions = 'Hey @' + target +'! @' + user + ' requested your review 🥰'
            } else if (author != target) {
              user_mentions = 'Wow @' + author +'! @' + user + ' will also review your PR 😍'
            } else {
              user_mentions = 'You requested review to yourself @' + target +'.. Are you sure 🙄?'
            }
            
            // Add PR comment prefix guidelines
            const prefixGuide = '\n\n---\n**PR Review Comment Prefixes:**\n' +
              '- `H)` High priority - Must be fixed before merge\n' +
              '- `M)` Medium priority - Should be addressed if possible\n' +
              '- `L)` Low priority - Optional improvement\n' +
              '- `Q)` Question - Requires a response from the author'

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: user_mentions + prefixGuide + '\n<!-- translation-skip -->'
            })
