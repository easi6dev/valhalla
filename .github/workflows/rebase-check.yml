# ==============================================================================
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY
# ==============================================================================
# This file is managed from a central 'easi6dev/tada-server-common-source' repository to ensure
# consistency across all projects.
#
# To make changes, follow these steps:
# 1. Edit the source file in the 'easi6dev/tada-server-common-source' repository and create a pull request:
#    https://github.com/easi6dev/tada-server-common-source
#
# 2. After your changes are merged, you MUST manually trigger the 'Sync' workflow
#    to apply them to all projects. Run the workflow here:
#    https://github.com/easi6dev/tada-server-common-source/actions/workflows/sync.yml
# ==============================================================================

# This is a basic workflow to help you get started with Actions
name: Rebase Check
# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  pull_request:
    types: [assigned, unassigned, labeled, unlabeled, opened, edited, reopened, synchronize]
    branches: "*"
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Checkout Branch
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # NOTE: This step deviates from the tada-server-common-source original.
    # Upstream interpolates ${{ github.head_ref }} directly into the run block.
    # That is safe in the private TADA repos (opening a PR requires org
    # membership), but easi6dev/valhalla is a PUBLIC fork: anyone can open a PR
    # from a branch whose name contains shell metacharacters, and the templating
    # engine would splice it into this script before bash parses it — arbitrary
    # code execution on the runner. Refs are passed via env: instead, where the
    # value reaches bash as data and is never re-parsed as source.
    # Please preserve this deviation when re-syncing from the central repo.
    - name: Check rebased
      env:
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        git checkout "$HEAD_REF"
        git checkout "$BASE_REF"
        base_hash=$(git show-ref --heads -s "$BASE_REF")
        pr_merge_hash=$(git merge-base "$BASE_REF" "$HEAD_REF")
        if [ "$base_hash" = "$pr_merge_hash" ]; then
          echo "Already rebased, merge-base commit ${base_hash}"
        else
          echo "Branch is not rebased onto ${BASE_REF}. Please rebase."
          exit 1
        fi
