# ==============================================================================
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY
# ==============================================================================
# This file is managed from a central 'easi6dev/tada-server-common-source' repository to ensure
# consistency across all projects.
#
# To make changes, follow these steps:
# 1. Edit the source file in the 'easi6dev/tada-server-common-source' repository and create a pull request:
#    https://github.com/easi6dev/tada-server-common-source
#
# 2. After your changes are merged, you MUST manually trigger the 'Sync' workflow
#    to apply them to all projects. Run the workflow here:
#    https://github.com/easi6dev/tada-server-common-source/actions/workflows/sync.yml
# ==============================================================================

name: Rebase

on:
  issue_comment:
    types: [created]

jobs:
  rebase:
    # NOTE: The author_association check deviates from the
    # tada-server-common-source original. In the private TADA repos, only org
    # members can comment at all, so an unguarded '/rebase' is fine. This repo
    # is a PUBLIC fork, where any GitHub user can comment on a PR — without this
    # gate, an arbitrary internet user could trigger a force-push carried out
    # with ORG_GITHUB_ACTION_CI_TOKEN (contents: write).
    # Please preserve this deviation when re-syncing from the central repo.
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/rebase') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Get PR branch info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('base_ref', pr.data.base.ref);

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0
          # Fall back to GITHUB_TOKEN if the org PAT is not granted to this repo:
          # an empty `token:` makes actions/checkout fail with
          # "Input required and not supplied: token".
          token: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Rebase on base branch
        env:
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BASE_REF"
          git rebase "origin/$BASE_REF"
          git push --force-with-lease

      - name: React on success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'rocket'
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ':x: Rebase failed. There may be merge conflicts.'
            });
