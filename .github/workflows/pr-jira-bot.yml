# How to add this jir-bot to your github repo?
# 1. Copy&paste `pr-jira-bot.yml` and `scripts/pr-jira-bot.js` files into the `.github` dir of your repository.
# 2. Done. (Jira credentials come from the org-level `ORG_JIRA_BASIC_CREDENTIALS` secret.)

# How to rotate the Jira API Token? (org admins only)
# 1. Go to https://id.atlassian.com/manage-profile/security/api-tokens.
# 2. Create a new API Token.
# 3. Create a base64 encoded string for basic credential (run: "echo -n [Atlassian email]:[Jira API token] | base64")
# 4. Go to the org's Actions Secret page -> https://github.com/organizations/easi6dev/settings/secrets/actions
# 5. Update the `ORG_JIRA_BASIC_CREDENTIALS` secret with the encoded string.

name: PR JIRA Label Bot

on:
  pull_request:
    types: [opened]

jobs:
  add-jira-label:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/Iron"
      - name: Run JIRA Label Script
        run: node ./.github/scripts/pr-jira-bot.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_BASIC_CREDENTIALS: ${{ secrets.ORG_JIRA_BASIC_CREDENTIALS }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}