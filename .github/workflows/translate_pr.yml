# ==============================================================================
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY
# ==============================================================================
# This file is managed from a central 'easi6dev/tada-server-common-source' repository to ensure
# consistency across all projects.
#
# To make changes, follow these steps:
# 1. Edit the source file in the 'easi6dev/tada-server-common-source' repository and create a pull request:
#    https://github.com/easi6dev/tada-server-common-source
#
# 2. After your changes are merged, you MUST manually trigger the 'Sync' workflow
#    to apply them to all projects. Run the workflow here:
#    https://github.com/easi6dev/tada-server-common-source/actions/workflows/sync.yml
# ==============================================================================

# Automatically translates PR content bidirectionally on any trigger:
# - Non-English → English (translation on top, original in collapsible)
# - English → Korean (original on top, Korean in collapsible)
#
# Scans the ENTIRE PR (body + all comments + review comments + review bodies)
# and translates any untranslated content, except items authored by
# `github-actions[bot]` — that identity covers every workflow bot in this
# repo (Claude reviewer, reviewer-suggester, review-request pings, etc.),
# all posted via the default GITHUB_TOKEN, so there is no way to translate
# one without translating them all.
#
# All translation logic lives in `.github/scripts/translate-pr.js`. The
# system prompt for the LLM lives in `.github/prompts/translate_pr_role.md`.
#
# Marker conventions (full state machine in translate-pr.js):
# - `<!-- translated-by-claude -->`     → already translated, skip
# - `<!-- translation-in-progress -->`  → run was cancelled mid-flight,
#                                          recovered automatically next event
# To force re-translation of an item, manually delete the
# `<!-- translated-by-claude -->` marker from its body.
#
# Reuses the same org secrets as claude-pr-review-spring-boot.yml
# (ORG_LITELLM_API_KEY, ORG_LITELLM_ENDPOINT) — no additional setup needed.

name: Translate PR Comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: translate-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: mvlchain-runner
    # Items authored by `github-actions[bot]` are excluded from translation
    # entirely (see isExcludedAuthor in translate-pr.js) — that covers every
    # workflow bot in this repo, since they all post via the default
    # GITHUB_TOKEN. Non-`github-actions` bots (e.g. a dedicated Jira sync
    # bot) are still translated.
    #
    # The `sender.login != 'github-actions[bot]'` check below is a separate,
    # narrower guard: it only prevents the `pull_request: edited` self-loop
    # when this workflow updates the PR body (GitHub fires `pull_request:
    # edited` with sender == github-actions[bot] on that update). Other
    # events (issue_comment, pull_request_review, pull_request_review_comment)
    # do NOT refire on bot edits, so they need no sender check. The marker
    # (`<!-- translated-by-claude -->`) prevents re-translating any item we
    # have already touched.
    #
    # `issue_comment` also fires for comments on plain (non-PR) issues, so
    # it is gated on `github.event.issue.pull_request` being present —
    # otherwise translate-pr.js treats the issue number as a PR number and
    # `pulls.get` 404s.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.sender.login != 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_review_comment'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Translate all PR content
        uses: actions/github-script@v7
        env:
          LITELLM_API_KEY: ${{ secrets.ORG_LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
          LITELLM_BASE_URL: ${{ secrets.ORG_LITELLM_ENDPOINT }}
        with:
          script: |
            const path = require("path");
            const { main } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/translate-pr.js"),
            );
            await main({ github, context, core });
