# ==============================================================================
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY
# ==============================================================================
# This file is managed from a central 'easi6dev/tada-server-common-source' repository to ensure
# consistency across all projects.
#
# To make changes, follow these steps:
# 1. Edit the source file in the 'easi6dev/tada-server-common-source' repository and create a pull request:
#    https://github.com/easi6dev/tada-server-common-source
#
# 2. After your changes are merged, you MUST manually trigger the 'Sync' workflow
#    to apply them to all projects. Run the workflow here:
#    https://github.com/easi6dev/tada-server-common-source/actions/workflows/sync.yml
# ==============================================================================

# Automatically translates PR content bidirectionally on any trigger:
# - Non-English → English (translation on top, original in collapsible)
# - English → Korean (original on top, Korean in collapsible)
#
# Scans the ENTIRE PR (body + all comments + review comments + review bodies)
# and translates any untranslated content. That includes content posted by
# `github-actions[bot]` (Claude reviewer, reviewer-suggester, review-request
# pings) — translating those AI comments is the point of this workflow.
#
# Two things are skipped:
# - Content authored by `aws-security-agent[bot]`
#   (EXCLUDED_AUTHOR_PREFIXES in translate-pr.js).
# - Content too short to be worth translating: under 20 letters, or under 8
#   for Hangul text ("LGTM", "확인했습니다"). A human reads those as they
#   stand, and a translation block would only bury them. The thresholds are
#   CONFIG.MIN_LETTERS_DEFAULT / MIN_LETTERS_HANGUL; why the two differ is
#   explained on isTooShortToTranslate.
#
# All translation logic lives in `.github/scripts/translate-pr.js`. The
# system prompt for the LLM lives in `.github/prompts/translate_pr_role.md`.
#
# Marker conventions (full state machine in translate-pr.js):
# - `<!-- translated-by-claude -->`     → already translated, skip
# - `<!-- translation-in-progress -->`  → run was cancelled mid-flight,
#                                          recovered automatically next event
# To force re-translation of an item, manually delete the
# `<!-- translated-by-claude -->` marker from its body.
#
# Reuses the same org secrets as claude-pr-review-spring-boot.yml
# (ORG_LITELLM_API_KEY, ORG_LITELLM_ENDPOINT) — no additional setup needed.

name: Translate PR Comments

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: translate-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  translate:
    runs-on: mvlchain-runner
    # translate-pr.js skips two things: items authored by
    # `aws-security-agent[bot]` (EXCLUDED_AUTHOR_PREFIXES) and items too short
    # to be worth translating (isTooShortToTranslate). Everything else is
    # translated, `github-actions[bot]` included.
    #
    # The `sender.login != 'github-actions[bot]'` check below is unrelated
    # to that author exclusion: it only prevents the `pull_request: edited`
    # self-loop when this workflow updates the PR body (GitHub fires
    # `pull_request: edited` with sender == github-actions[bot] on that
    # update). The other events (issue_comment, pull_request_review,
    # pull_request_review_comment) do not subscribe to `edited`, so this
    # workflow's own updates raise no new event and need no sender check.
    # The marker (`<!-- translated-by-claude -->`) prevents re-translating
    # any item we have already touched.
    #
    # `issue_comment` also fires for comments on plain (non-PR) issues, so
    # it is gated on `github.event.issue.pull_request` being present —
    # otherwise translate-pr.js treats the issue number as a PR number and
    # `pulls.get` 404s.
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.sender.login != 'github-actions[bot]' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      github.event_name == 'pull_request_review' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_review_comment'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Translate all PR content
        uses: actions/github-script@v7
        env:
          LITELLM_API_KEY: ${{ secrets.ORG_LITELLM_API_KEY }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
          LITELLM_BASE_URL: ${{ secrets.ORG_LITELLM_ENDPOINT }}
        with:
          script: |
            const path = require("path");
            const { main } = require(
              path.join(process.env.GITHUB_WORKSPACE, ".github/scripts/translate-pr.js"),
            );
            await main({ github, context, core });
