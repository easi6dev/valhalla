# ==============================================================================
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY
# ==============================================================================
# This file is managed from a central 'easi6dev/tada-server-common-source' repository to ensure
# consistency across all projects.
#
# To make changes, follow these steps:
# 1. Edit the source file in the 'easi6dev/tada-server-common-source' repository and create a pull request:
#    https://github.com/easi6dev/tada-server-common-source
#
# 2. After your changes are merged, you MUST manually trigger the 'Sync' workflow
#    to apply them to all projects. Run the workflow here:
#    https://github.com/easi6dev/tada-server-common-source/actions/workflows/sync.yml
# ==============================================================================

name: PR Mongo Reviewer

# Requests a review from the MongoDB owner when a PR changes MongoDB-related
# source code or mongo config lines in application*.yml (see
# scripts/pr-mongo-reviewer.js for the detection rules).

on:
  pull_request:
    # `opened`/`ready_for_review` cover PR creation; `synchronize` re-checks
    # later pushes so Mongo code added after opening is still routed.
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-mongo-reviewer:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/Iron"
      - name: Run Mongo Reviewer Script
        run: node ./.github/scripts/pr-mongo-reviewer.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
