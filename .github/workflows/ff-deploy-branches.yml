# ==============================================================================
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY
# ==============================================================================
# This file is managed from a central 'easi6dev/tada-server-common-source' repository to ensure
# consistency across all projects.
#
# To make changes, follow these steps:
# 1. Edit the source file in the 'easi6dev/tada-server-common-source' repository and create a pull request:
#    https://github.com/easi6dev/tada-server-common-source
#
# 2. After your changes are merged, you MUST manually trigger the 'Sync' workflow
#    to apply them to all projects. Run the workflow here:
#    https://github.com/easi6dev/tada-server-common-source/actions/workflows/sync.yml
# ==============================================================================

name: Fast-forward deploy branches on master push

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  updateBranchTadaDev:
    name: Fast-forward TADA dev to master
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout the latest code
      uses: actions/checkout@v4
      with:
        ref: development
        fetch-depth: 0
        token: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
    - name: Fast-forward dev to master
      id: ff-dev
      continue-on-error: true
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: |
        BASE_BRANCH="${{ github.event.repository.default_branch }}"
        git fetch origin "$BASE_BRANCH"
        git merge --ff-only "origin/$BASE_BRANCH"
        git push origin development
    - name: Rebase dev onto master
      id: rebase-dev
      if: steps.ff-dev.outcome == 'failure'
      continue-on-error: true
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"

        # Skip if branch doesn't exist
        if ! git show-ref --verify --quiet refs/remotes/origin/development; then
          echo "Branch 'development' does not exist, skipping rebase"
          exit 0
        fi

        BASE_BRANCH="${{ github.event.repository.default_branch }}"
        git checkout development
        git rebase --rebase-merges "origin/$BASE_BRANCH"
        git push --force-with-lease origin development
      env:
        GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
    - name: Trigger AI rebase for dev
      id: ai-rebase-dev
      if: steps.ff-dev.outcome == 'failure' && steps.rebase-dev.outcome == 'failure'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
        REPO: ${{ github.repository }}
        TRIGGER_COMMIT: ${{ github.event.head_commit.id }}
        CF_ACCESS_CLIENT_ID: ${{ secrets.ORG_SUPPORT_AGENT_CF_SERVICE_TOKEN_ID }}
        CF_ACCESS_CLIENT_SECRET: ${{ secrets.ORG_SUPPORT_AGENT_CF_SERVICE_TOKEN_SECRET }}
      run: |
        if ! git show-ref --verify --quiet refs/remotes/origin/development; then
          exit 0
        fi

        PR_NUMBER=""
        PR_AUTHOR=""
        if [ -n "$TRIGGER_COMMIT" ]; then
          PR_NUMBER=$(gh api "repos/${REPO}/commits/${TRIGGER_COMMIT}/pulls" --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            PR_AUTHOR=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.user.login // empty')
          fi
        fi

        curl -fsS -X POST \
          "https://supporter-agent.mvllabs.com/api/rebase-monitor/trigger" \
          -H "Content-Type: application/json" \
          -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
          -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
          -d "$(jq -n \
            --arg orgRepo "$REPO" \
            --arg branch "development" \
            --arg baseBranch "${{ github.event.repository.default_branch }}" \
            --arg prAuthor "$PR_AUTHOR" \
            --argjson prNumber "${PR_NUMBER:-null}" \
            '{orgRepo: $orgRepo, branch: $branch, baseBranch: $baseBranch, prAuthor: $prAuthor, prNumber: $prNumber}'
          )"
    - name: Notify on failure
      if: steps.ff-dev.outcome == 'failure' && steps.rebase-dev.outcome == 'failure'
      env:
        GH_TOKEN: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
        REPO: ${{ github.repository }}
        TRIGGER_COMMIT: ${{ github.event.head_commit.id }}
      run: |
        # Skip if branch doesn't exist
        if ! git show-ref --verify --quiet refs/remotes/origin/development; then
          echo "Branch 'development' does not exist, skipping notification"
          exit 0
        fi

        # Skip if no trigger commit (e.g. workflow_dispatch)
        if [ -z "$TRIGGER_COMMIT" ]; then
          echo "No trigger commit found, skipping notification"
          exit 0
        fi

        # Fetch PR associated with the trigger commit via GitHub API
        PR_NUMBER=$(gh api "repos/${REPO}/commits/${TRIGGER_COMMIT}/pulls" --jq '.[0].number // empty')
        if [ -z "$PR_NUMBER" ]; then
          echo "No PR found for commit ${TRIGGER_COMMIT}"
          exit 0
        fi

        # Fetch PR author
        PR_AUTHOR=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.user.login')
        if [ -z "$PR_AUTHOR" ]; then
          echo "Could not fetch PR author"
          exit 1
        fi

        TEMPLATE=$(cat .github/templates/ff-failure-message.md)
        BODY=$(echo "$TEMPLATE" | sed "s/{{author}}/$PR_AUTHOR/g" | sed "s/{{branch}}/development/g")
        gh pr comment "$PR_NUMBER" --body "$BODY"
        exit 1
  updateBranchTadaTest:
    name: Fast-forward TADA test to master
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout the latest code
      uses: actions/checkout@v4
      with:
        ref: test
        fetch-depth: 0
        token: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
    - name: Fast-forward test to master
      id: ff-test
      continue-on-error: true
      if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      run: |
        BASE_BRANCH="${{ github.event.repository.default_branch }}"
        git fetch origin "$BASE_BRANCH"
        git merge --ff-only "origin/$BASE_BRANCH"
        git push origin test
    - name: Rebase test onto master
      id: rebase-test
      if: steps.ff-test.outcome == 'failure'
      continue-on-error: true
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"

        # Skip if branch doesn't exist
        if ! git show-ref --verify --quiet refs/remotes/origin/test; then
          echo "Branch 'test' does not exist, skipping rebase"
          exit 0
        fi

        BASE_BRANCH="${{ github.event.repository.default_branch }}"
        git checkout test
        git rebase --rebase-merges "origin/$BASE_BRANCH"
        git push --force-with-lease origin test
      env:
        GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
    - name: Trigger AI rebase for test
      id: ai-rebase-test
      if: steps.ff-test.outcome == 'failure' && steps.rebase-test.outcome == 'failure'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
        REPO: ${{ github.repository }}
        TRIGGER_COMMIT: ${{ github.event.head_commit.id }}
        CF_ACCESS_CLIENT_ID: ${{ secrets.ORG_SUPPORT_AGENT_CF_SERVICE_TOKEN_ID }}
        CF_ACCESS_CLIENT_SECRET: ${{ secrets.ORG_SUPPORT_AGENT_CF_SERVICE_TOKEN_SECRET }}
      run: |
        if ! git show-ref --verify --quiet refs/remotes/origin/test; then
          exit 0
        fi

        PR_NUMBER=""
        PR_AUTHOR=""
        if [ -n "$TRIGGER_COMMIT" ]; then
          PR_NUMBER=$(gh api "repos/${REPO}/commits/${TRIGGER_COMMIT}/pulls" --jq '.[0].number // empty')
          if [ -n "$PR_NUMBER" ]; then
            PR_AUTHOR=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.user.login // empty')
          fi
        fi

        curl -fsS -X POST \
          "https://supporter-agent.mvllabs.com/api/rebase-monitor/trigger" \
          -H "Content-Type: application/json" \
          -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
          -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
          -d "$(jq -n \
            --arg orgRepo "$REPO" \
            --arg branch "test" \
            --arg baseBranch "${{ github.event.repository.default_branch }}" \
            --arg prAuthor "$PR_AUTHOR" \
            --argjson prNumber "${PR_NUMBER:-null}" \
            '{orgRepo: $orgRepo, branch: $branch, baseBranch: $baseBranch, prAuthor: $prAuthor, prNumber: $prNumber}'
          )"
    - name: Notify on failure
      if: steps.ff-test.outcome == 'failure' && steps.rebase-test.outcome == 'failure'
      env:
        GH_TOKEN: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
        REPO: ${{ github.repository }}
        TRIGGER_COMMIT: ${{ github.event.head_commit.id }}
      run: |
        # Skip if branch doesn't exist
        if ! git show-ref --verify --quiet refs/remotes/origin/test; then
          echo "Branch 'test' does not exist, skipping notification"
          exit 0
        fi

        # Skip if no trigger commit (e.g. workflow_dispatch)
        if [ -z "$TRIGGER_COMMIT" ]; then
          echo "No trigger commit found, skipping notification"
          exit 0
        fi

        # Fetch PR associated with the trigger commit via GitHub API
        PR_NUMBER=$(gh api "repos/${REPO}/commits/${TRIGGER_COMMIT}/pulls" --jq '.[0].number // empty')
        if [ -z "$PR_NUMBER" ]; then
          echo "No PR found for commit ${TRIGGER_COMMIT}"
          exit 0
        fi

        # Fetch PR author
        PR_AUTHOR=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.user.login')
        if [ -z "$PR_AUTHOR" ]; then
          echo "Could not fetch PR author"
          exit 1
        fi

        TEMPLATE=$(cat .github/templates/ff-failure-message.md)
        BODY=$(echo "$TEMPLATE" | sed "s/{{author}}/$PR_AUTHOR/g" | sed "s/{{branch}}/test/g")
        gh pr comment "$PR_NUMBER" --body "$BODY"
        exit 1
  updateBranchTadaStaging:
    name: Fast-forward TADA staging to master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the latest code
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0
          token: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
      - name: Fast-forward staging to master
        continue-on-error: true
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          BASE_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$BASE_BRANCH"
          git merge --ff-only "origin/$BASE_BRANCH"
          git push origin staging
