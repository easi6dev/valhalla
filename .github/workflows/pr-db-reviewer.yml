# ==============================================================================
# IMPORTANT: DO NOT EDIT THIS FILE DIRECTLY
# ==============================================================================
# This file is managed from a central 'easi6dev/tada-server-common-source' repository to ensure
# consistency across all projects.
#
# To make changes, follow these steps:
# 1. Edit the source file in the 'easi6dev/tada-server-common-source' repository and create a pull request:
#    https://github.com/easi6dev/tada-server-common-source
#
# 2. After your changes are merged, you MUST manually trigger the 'Sync' workflow
#    to apply them to all projects. Run the workflow here:
#    https://github.com/easi6dev/tada-server-common-source/actions/workflows/sync.yml
# ==============================================================================

name: PR DB Reviewer

# Requests a review from the DB owner when a PR changes MongoDB-related
# source code, mongo config lines in application*.yml, or queries against
# hot RDB tables such as ride_entity (see scripts/pr-db-reviewer.js for the
# detection rules).
#
# Reuses the same org secrets as claude-pr-review-spring-boot.yml
# (ORG_LITELLM_API_KEY, ORG_LITELLM_ENDPOINT) for the hot-table LLM check.
# If they are unavailable, a hot-table name match in the query files decides.
#
# The hot-table list is read at run time from .github/db-reviewer/hot-tables.json
# in easi6dev/tada-server-common-source (the single source of truth, not synced),
# using ORG_GITHUB_ACTION_CI_TOKEN because GITHUB_TOKEN cannot read that repository.

on:
  pull_request:
    # `opened`/`ready_for_review` cover PR creation; `synchronize` re-checks
    # later pushes so DB changes added after opening are still routed.
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-db-reviewer:
    if: github.event.pull_request.draft == false
    # Self-hosted like translate_pr.yml / claude-pr-review-spring-boot.yml: the LiteLLM
    # endpoint was unreachable from ubuntu-latest ("fetch failed").
    runs-on: mvlchain-runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/Iron"
      - name: Run DB Reviewer Script
        run: node ./.github/scripts/pr-db-reviewer.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.number }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LITELLM_API_KEY: ${{ secrets.ORG_LITELLM_API_KEY }}
          LITELLM_BASE_URL: ${{ secrets.ORG_LITELLM_ENDPOINT }}
          LITELLM_MODEL: ${{ secrets.LITELLM_MODEL }}
          HOT_TABLES_TOKEN: ${{ secrets.ORG_GITHUB_ACTION_CI_TOKEN }}
