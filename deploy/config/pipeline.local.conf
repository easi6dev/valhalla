# =============================================================================
# Local Dev Pipeline Configuration
# =============================================================================
# NOT committed to git — copy pipeline.conf.example to get started.
# =============================================================================

VALHALLA_ENV=local

# Paths — anchored to ${PROJECT_ROOT} (the repo root, derived by the pipeline as
# SCRIPT_DIR/../..) so output lands in <repo>/data and <repo>/logs regardless of
# the CWD you invoke the pipeline from. This conf is sourced from inside
# bootstrap(), by which point PROJECT_ROOT is already set, so it expands here.
# Both dirs are gitignored and safe to delete — they hold local build output only.
VALHALLA_TILE_DIR=${PROJECT_ROOT}/data/valhalla_tiles
OSM_DIR=${PROJECT_ROOT}/data/osm
VALHALLA_ADMIN_DIR=${PROJECT_ROOT}/data/admin_data
VALHALLA_LOG_DIR=${PROJECT_ROOT}/logs

# Build options — elevation skipped for faster local iteration
SKIP_ELEVATION=true

# S3 — disabled locally
S3_TILE_BUCKET=
S3_REGION=ap-southeast-1

# Binary built from source (set to blank to use Docker instead)
# VALHALLA_BUILD_TILES_BIN=/mnt/c/Users/<user>/Workspace/valhalla/build/src/valhalla_build_tiles
VALHALLA_BUILD_TILES_BIN=
VALHALLA_DOCKER_IMAGE=valhalla:local
