# =============================================================================
# Production Pipeline Configuration
# =============================================================================
# NOT committed to git — managed via secrets manager (AWS SSM, Vault, etc.)
# in CI/CD. Fill in the EFS mount point and S3 bucket before deploying.
# =============================================================================

VALHALLA_ENV=prod

# Paths — EFS mount (shared across all app instances and the builder)
# Mount EFS at /mnt/efs before running the pipeline.
# EFS access point: /valhalla_tiles (read-write for builder, read-only for app)
VALHALLA_TILE_DIR=/mnt/efs/valhalla_tiles
OSM_DIR=/mnt/efs/valhalla_osm
VALHALLA_ADMIN_DIR=/mnt/efs/valhalla_admin
VALHALLA_LOG_DIR=/var/log/valhalla

# Build options — full quality build for production
SKIP_ELEVATION=false

# S3 — production archive bucket (fill in your bucket name)
# S3_TILE_BUCKET=s3://<base-path>/tiles
S3_TILE_BUCKET=
S3_REGION=ap-southeast-1

# Docker — from-source tile builder. MUST be an image built from THIS repo
# (docker/Dockerfile.tilebuilder) so the tile binary layout matches the
# libvalhalla.so.3 bundled in the JNI JAR. NEVER use ghcr.io/valhalla/valhalla:latest
# (a floating upstream tag) — a version skew between the builder and the JAR's
# native lib produces SIGBUS in costing (AutoCost::Allowed) on every route.
VALHALLA_BUILD_TILES_BIN=
VALHALLA_DOCKER_IMAGE=633107344074.dkr.ecr.ap-southeast-1.amazonaws.com/valhalla:development-latest
