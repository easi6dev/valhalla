# =============================================================================
# Production Pipeline Configuration — US CLUSTER
# =============================================================================
# Used by deploy/scripts/run-tile-pipeline-us.sh on the US server cluster.
# Separate from pipeline.prod.conf (Singapore/APAC): its own EFS mount, its own
# S3 bucket in us-east-1, and its own container registry.
#
# NOT committed to git — managed via secrets manager (AWS SSM, Vault, etc.) in
# CI/CD. Fill in the EFS mount point, S3 bucket, and ECR image before deploying.
# Select with:  VALHALLA_ENV=prod-us ./run-tile-pipeline-us.sh new_york
# =============================================================================

VALHALLA_ENV=prod

# Paths — US EFS mount (shared across US app instances and the US builder).
# Mount the US EFS at /mnt/efs-us before running the pipeline.
# Distinct mount from the SG cluster so the two regions never share storage.
VALHALLA_TILE_DIR=/mnt/efs/valhalla_tiles
OSM_DIR=/mnt/efs/valhalla_osm
VALHALLA_ADMIN_DIR=/mnt/efs/valhalla_admin
VALHALLA_LOG_DIR=/var/log/valhalla

# Build options — full quality build for production (elevation on).
SKIP_ELEVATION=false

# S3 — US production archive bucket in us-east-1 (fill in your bucket name).
# S3_TILE_BUCKET=s3://<us-base-path>/tiles
S3_TILE_BUCKET=
S3_REGION=ap-southeast-1

# Docker — US container registry (fill in the US ECR image).
# Leaving VALHALLA_DOCKER_IMAGE blank falls back to the public ghcr.io image.
VALHALLA_BUILD_TILES_BIN=
# VALHALLA_DOCKER_IMAGE=<acct>.dkr.ecr.us-east-1.amazonaws.com/valhalla:production
VALHALLA_DOCKER_IMAGE=ghcr.io/valhalla/valhalla:latest
