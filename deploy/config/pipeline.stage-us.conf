# =============================================================================
# Staging Pipeline Configuration — US CLUSTER
# =============================================================================
# Used by deploy/scripts/run-tile-pipeline-us.sh on the US staging cluster.
# Separate from pipeline.stage.conf (Singapore/APAC): its own EFS mount, its own
# S3 bucket in us-east-1, and its own container registry.
#
# NOT committed to git — managed via secrets manager (AWS SSM, Vault, etc.) in
# CI/CD. Fill in the EFS mount point, S3 bucket, and ECR image before deploying.
# Select with:  VALHALLA_ENV=stage-us ./run-tile-pipeline-us.sh new_york
# =============================================================================

VALHALLA_ENV=stage-us

# Paths — US staging EFS mount (shared across US app instances and the builder).
VALHALLA_TILE_DIR=/mnt/efs/valhalla_tiles
OSM_DIR=/mnt/efs/valhalla_osm
VALHALLA_ADMIN_DIR=/mnt/efs/valhalla_admin
VALHALLA_LOG_DIR=/var/log/valhalla

# Build options — elevation skipped on staging for faster weekly rebuilds.
SKIP_ELEVATION=true
CLEAN_BUILD=false

# S3 — US staging archive bucket in us-east-1 (fill in your bucket name).
# S3_TILE_BUCKET=s3://<us-staging-base-path>/tiles
S3_TILE_BUCKET=
S3_REGION=us-east-1

# Docker — US container registry (fill in the US ECR image).
VALHALLA_BUILD_TILES_BIN=
# VALHALLA_DOCKER_IMAGE=<acct>.dkr.ecr.us-east-1.amazonaws.com/valhalla:staging
VALHALLA_DOCKER_IMAGE=ghcr.io/valhalla/valhalla:latest
