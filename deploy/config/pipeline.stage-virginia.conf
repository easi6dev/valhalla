# =============================================================================
# Staging Pipeline Configuration — US CLUSTER
# =============================================================================
# Used by deploy/scripts/run-tile-pipeline-us.sh on the US staging cluster.
# Separate from pipeline.stage.conf (Singapore/APAC): its own EFS mount, its own
# S3 bucket in us-east-1, and its own container registry.
#
# NOT committed to git — managed via secrets manager (AWS SSM, Vault, etc.) in
# CI/CD. Fill in the EFS mount point, S3 bucket, and ECR image before deploying.
# Select with:  VALHALLA_ENV=stage-virginia ./run-tile-pipeline-us.sh new_york
# =============================================================================

VALHALLA_ENV=stage-virginia

# Paths — US staging EFS mount (shared across US app instances and the builder).
VALHALLA_TILE_DIR=/mnt/efs/valhalla_tiles
OSM_DIR=/mnt/efs/valhalla_osm
VALHALLA_ADMIN_DIR=/mnt/efs/valhalla_admin
VALHALLA_LOG_DIR=/var/log/valhalla

# Build options — elevation skipped on staging for faster weekly rebuilds.
SKIP_ELEVATION=true

# S3 — US staging archive bucket in us-east-1.
#
# The bucket NAME is keyed to the ENVIRONMENT (stage) and is deliberately shared
# with pipeline.stage.conf; S3_REGION is what selects the cluster. This name in
# us-east-1 (here) and the same name in ap-southeast-1 (SG) are two DIFFERENT
# physical buckets, since a bucket is scoped to its region/account.
#
# bootstrap's _preflight_s3 HARD-FAILS (exit 1) on a blank bucket in any
# non-local env, and verifies the bucket is reachable in S3_REGION from this
# host's IAM role — at bootstrap, before the multi-hour build.
S3_TILE_BUCKET=s3://tada-stage-virginia-valhalla-tiles
S3_REGION=us-east-1

# Docker — from-source tile builder. MUST be an image built from THIS repo
# (docker/Dockerfile.tilebuilder) so the tile binary layout matches the
# libvalhalla.so.3 bundled in the JNI JAR. NEVER use ghcr.io/valhalla/valhalla:latest
# (a floating upstream tag) — a version skew between the builder and the JAR's
# native lib produces SIGBUS in costing (AutoCost::Allowed) on every route.
VALHALLA_BUILD_TILES_BIN=
VALHALLA_DOCKER_IMAGE=633107344074.dkr.ecr.ap-southeast-1.amazonaws.com/valhalla:staging-latest
