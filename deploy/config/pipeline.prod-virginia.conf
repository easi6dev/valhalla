# =============================================================================
# Production Pipeline Configuration — US CLUSTER
# =============================================================================
# Used by deploy/scripts/run-tile-pipeline-us.sh on the US server cluster.
# Separate from pipeline.prod.conf (Singapore/APAC): its own EFS mount, its own
# S3 bucket in us-east-1, and its own container registry.
#
# NOT committed to git — managed via secrets manager (AWS SSM, Vault, etc.) in
# CI/CD. Fill in the EFS mount point, S3 bucket, and ECR image before deploying.
# Select with:  VALHALLA_ENV=prod-virginia ./run-tile-pipeline-us.sh new_york
# =============================================================================

# MUST be prod-virginia so _load_pipeline_config selects THIS file (pipeline.prod-virginia.conf)
# and the US cron resolves the US cluster paths. The container image sets
# ENV VALHALLA_ENV=prod (for the SG pipeline), so the US cron MUST export
# VALHALLA_ENV=prod-virginia (or VALHALLA_PIPELINE_CONFIG=.../pipeline.prod-virginia.conf) before
# invoking run-tile-pipeline-us.sh — otherwise it loads pipeline.prod.conf (SG).
VALHALLA_ENV=prod-virginia

# Paths — US EFS mount (shared across US app instances and the US builder).
# Mount the US EFS at /mnt/efs before running the pipeline.
# This is a DIFFERENT physical EFS filesystem from the SG cluster's, mounted at
# the same path on US hosts. The clusters never share storage because they are
# separate hosts in separate accounts/regions — not because the paths differ.
VALHALLA_TILE_DIR=/mnt/efs/valhalla_tiles
OSM_DIR=/mnt/efs/valhalla_osm
VALHALLA_ADMIN_DIR=/mnt/efs/valhalla_admin
VALHALLA_LOG_DIR=/var/log/valhalla

# Build options — elevation skipped: only bicycle/pedestrian/motorscooter costing
# reads edge grade (src/sif/{bicycle,pedestrian,motorscooter}cost.cc) and we serve
# auto/taxi only. Skipping avoids the DEM download and the 60m-per-edge resampling
# in valhalla_build_tiles. NOTE: grade is baked into tiles at build time — turning
# this back on requires a full tile rebuild, not just a config change.
# Matches the tile_group setting in config/regions/regions.json (nyc_tri_state).
SKIP_ELEVATION=true

# S3 — US production archive bucket in us-east-1.
S3_TILE_BUCKET=s3://tada-prod-valhalla-tiles
S3_REGION=us-east-1

# Docker — from-source tile builder. MUST be an image built from THIS repo
# (docker/Dockerfile.tilebuilder) so the tile binary layout matches the
# libvalhalla.so.3 bundled in the JNI JAR. NEVER use ghcr.io/valhalla/valhalla:latest
# (a floating upstream tag) — a version skew between the builder and the JAR's
# native lib produces SIGBUS in costing (AutoCost::Allowed) on every route.
#
# Tag MUST be <branch>-latest or <branch>-<sha> — the only tags CI publishes.
# A bare ':latest' is orphaned/manual and can point at a different commit than
# the published JAR (publish-jni-jar.yml extracts the JAR from <branch>-latest).
VALHALLA_BUILD_TILES_BIN=
VALHALLA_DOCKER_IMAGE=633107344074.dkr.ecr.ap-southeast-1.amazonaws.com/valhalla:master-latest
